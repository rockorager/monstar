name: Release & AUR Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to build (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} binary
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag_name }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            curl \
            fonts-noto-cjk \
            fonts-noto-color-emoji \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            ncurses-bin \
            pkg-config \
            xz-utils

      - name: Install toolchain
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.6

      - name: Fetch Wayland schemas
        run: just setup

      - name: Build release binary package
        env:
          PICI_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: just dist

      - name: Store binary tarball
        uses: actions/upload-artifact@v7
        with:
          name: monstar-${{ matrix.arch }}-linux
          path: dist/monstar-*-${{ matrix.arch }}-linux.tar.gz
          if-no-files-found: error

  publish:
    name: Publish Release & AUR Packages
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag_name }}
          fetch-depth: 0

      - name: Fetch binary tarballs
        uses: actions/download-artifact@v8
        with:
          pattern: monstar-*-linux
          path: dist
          merge-multiple: true

      - name: Build source archive and AUR PKGBUILDs
        env:
          PICI_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: ./packaging/build-source-dist.sh

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag_name }}"
          gh release upload "$TAG" dist/monstar-*.tar.gz --clobber

      - name: Setup SSH key for AUR
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Add AUR to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Publish PKGBUILDs to AUR
        run: |
          ./packaging/upload-aur.sh monstar-bin packaging/arch/PKGBUILD
          ./packaging/upload-aur.sh monstar packaging/arch/PKGBUILD.source
          ./packaging/upload-aur.sh monstar-git packaging/arch/PKGBUILD.git
