name: Release & AUR Package

# `just release` pushes a vX.Y.Z tag with its release commit; this builds
# that tag, publishes the GitHub release, and updates the AUR packages.
on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }} binary
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            curl \
            fonts-noto-cjk \
            fonts-noto-color-emoji \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            ncurses-bin \
            pkg-config \
            xz-utils

      - name: Install toolchain
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.6

      - name: Fetch Wayland schemas
        run: just setup

      - name: Build release binary package
        env:
          PICI_TAG: ${{ github.ref_name }}
        run: just dist

      - name: Store binary tarball
        uses: actions/upload-artifact@v7
        with:
          name: monstar-${{ matrix.arch }}-linux
          path: dist/monstar-*-${{ matrix.arch }}-linux.tar.gz
          if-no-files-found: error

  publish:
    name: Publish Release & AUR Packages
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fetch binary tarballs
        uses: actions/download-artifact@v8
        with:
          pattern: monstar-*-linux
          path: dist
          merge-multiple: true

      - name: Build source archive and AUR PKGBUILDs
        env:
          PICI_TAG: ${{ github.ref_name }}
        run: ./packaging/build-source-dist.sh

      - name: Checksum
        working-directory: dist
        run: sha256sum -- monstar-*.tar.gz >SHA256SUMS

      # Checked-in notes describe a release when it has them; otherwise the
      # notes list the commits since the previous release.
      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${TAG#v}.md"
          if [ -s "$notes" ]; then
            cp "$notes" "$RUNNER_TEMP/notes.md"
          elif previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null); then
            git log --no-merges --format='- %s' --invert-grep -E --grep='^release: [0-9]+\.[0-9]+\.[0-9]+$' \
              "$previous..$TAG" >"$RUNNER_TEMP/notes.md"
          else
            : >"$RUNNER_TEMP/notes.md"
          fi

      # A rerun after a later step failed finds the release published and
      # replaces its assets instead.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/monstar-*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" --verify-tag --title "Monstar ${TAG#v}" \
              --notes-file "$RUNNER_TEMP/notes.md" dist/monstar-*.tar.gz dist/SHA256SUMS
          fi

      - name: Setup SSH key for AUR
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Add AUR to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Publish PKGBUILDs to AUR
        run: |
          ./packaging/upload-aur.sh monstar-bin packaging/arch/PKGBUILD
          ./packaging/upload-aur.sh monstar packaging/arch/PKGBUILD.source
          ./packaging/upload-aur.sh monstar-git packaging/arch/PKGBUILD.git
