name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            curl \
            fonts-noto-cjk \
            fonts-noto-color-emoji \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            ncurses-bin \
            pkg-config \
            xz-utils

      - name: Install toolchain
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.6

      - name: Fetch Wayland schemas
        run: just setup

      - name: Build, test, and lint
        run: just zig=zig ci
