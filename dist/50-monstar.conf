<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Copy this file to $XDG_CONFIG_HOME/fontconfig/conf.d/50-monstar.conf
  (normally ~/.config/fontconfig/conf.d/50-monstar.conf), then replace the
  example family names below with names reported by `fc-list : family`.

  Set `font-family = Monstar Custom` in the Monstar configuration after
  installing this file. Delete the style-specific rules if the regular family
  already provides the bold and italic faces you want. Monstar bundles Nerd
  Font symbols, so they do not need to be listed here.
-->
<fontconfig>
  <!-- Primary family followed by preferred language or script fallbacks. -->
  <alias binding="strong">
    <family>Monstar Custom</family>
    <prefer>
      <family>Your Regular Mono</family>
      <family>Your Language Mono</family>
    </prefer>
    <default>
      <family>monospace</family>
    </default>
  </alias>

  <!-- Bold requests. -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Monstar Custom</string>
    </test>
    <test name="weight" compare="eq">
      <const>bold</const>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Your Bold Mono</string>
    </edit>
  </match>

  <!-- Italic requests. -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Monstar Custom</string>
    </test>
    <test name="slant" compare="eq">
      <const>italic</const>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Your Italic Mono</string>
    </edit>
  </match>

  <!-- This more-specific rule runs last and wins for bold italic requests. -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Monstar Custom</string>
    </test>
    <test name="weight" compare="eq">
      <const>bold</const>
    </test>
    <test name="slant" compare="eq">
      <const>italic</const>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Your Bold Italic Mono</string>
    </edit>
  </match>
</fontconfig>
